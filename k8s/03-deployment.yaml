apiVersion: apps/v1
kind: Deployment
metadata:
  name: country-info-service
  namespace: country-info-service
  labels:
    app: country-info-service
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: country-info-service
  template:
    metadata:
      labels:
        app: country-info-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      terminationGracePeriodSeconds: 45
      # Spread replicas across nodes so one node failure doesn't take the service down
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: country-service
      initContainers:
        # Avoid CrashLoopBackOff noise on first install: wait until MySQL accepts connections
        - name: wait-for-mysql
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mysql 3306; do echo waiting for mysql; sleep 3; done"]
      containers:
        - name: country-info-service
          image: country-info-service:1.0.0
          imagePullPolicy: IfNotPresent   # local kind/minikube; use a registry tag + Always/IfNotPresent in real clusters
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: country-service-config
            - secretRef:
                name: country-service-secret
          env:
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOOMError"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 768Mi
          startupProbe:                     # gives the JVM up to 150s to boot before liveness kicks in
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:                   # includes DB connectivity: unready pods receive no traffic
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:                    # process-level only, so a DB blip does not restart pods
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]   # let the endpoint be removed from the Service before SIGTERM
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
