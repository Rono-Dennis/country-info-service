# DEMO ONLY, for the manual `kubectl apply -f k8s/` flow in docs/DEPLOY.md.
# deploy.sh does NOT apply this file: it creates the secret from environment variables
# (DB_USER, DB_PASSWORD, MYSQL_ROOT_PASSWORD) so no password is ever committed.
apiVersion: v1
kind: Secret
metadata:
  name: country-info-service-secret
  namespace: country-info-service
type: Opaque
stringData:
  DB_USER: "countryapp"
  DB_PASSWORD: "change-me-app-password"
  MYSQL_ROOT_PASSWORD: "change-me-root-password"
